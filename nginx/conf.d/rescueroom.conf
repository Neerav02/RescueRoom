upstream rescueroom_backend {
    server rescueroom-app:3001;
    keepalive 32;
}

# HTTP to HTTPS automatic redirection
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS Production Server Block
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/ssl/certs/rescueroom.crt;
    ssl_certificate_key /etc/ssl/certs/rescueroom.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration (TLS 1.2 & TLS 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # Defense-in-Depth Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # Client body limit (Max 15MB for optical evidence plates)
    client_max_body_size 15M;

    # Root proxy pass to Node.js backend
    location / {
        proxy_pass http://rescueroom_backend;
        proxy_http_version 1.1;

        # WebSocket support for CometChat and WebRTC signaling
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded identity headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Resilient timeout thresholds
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

